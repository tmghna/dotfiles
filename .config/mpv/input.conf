# Vim-style seeking
l seek  5
h seek -5
j add volume -2
k add volume  2

# Quick zoom and pan (useful for windowed tiling)
+ add video-zoom  0.1
- add video-zoom -0.1
Alt+h add video-pan-x  0.05
Alt+l add video-pan-x -0.05
Alt+k add video-pan-y  0.05
Alt+j add video-pan-y -0.05

# Reset everything
Backspace set video-zoom 0; set video-pan-x 0; set video-pan-y 0
