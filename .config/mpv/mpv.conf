# --- Video & Hardware Acceleration ---
profile=gpu-hq                  # High-quality rendering preset
hwdec=auto-safe                 # Automatically use your GPU to decode video
vo=gpu                          # GPU video output

# --- Audio (Native PipeWire) ---
ao=pipewire                     # Bypass PulseAudio for zero-latency PipeWire output
volume-max=150                  # Allow volume to be boosted to 150% (like VLC)

# --- General Behavior ---
keep-open=yes                   # Pause at the end of a video instead of instantly closing
save-position-on-quit=yes       # Remember exactly where you left off in a video
cursor-autohide=1000            # Hide the mouse cursor after 1 second of inactivity

# --- Catppuccin Mauve OSD (On-Screen Display) Theme ---
osd-font='JetBrainsMono Nerd Font'
osd-font-size=32
osd-color='#cdd6f4'             # Catppuccin Text
osd-border-color='#1e1e2e'      # Catppuccin Base
osd-shadow-color='#11111b'      # Catppuccin Crust
osd-bar-w=100                   # Full-width volume/seek bar
osd-bar-h=2                     # Super thin, minimalist bar
osd-bar-align-y=-1              # Put the bar at the very bottom
