# --- MODERN RENDERING BACKEND ---
backend = "glx";
vsync = true;
use-damage = true;
glx-copy-from-front = false;

# Corner and Opacity detection
detect-rounded-corners = true;
detect-client-opacity = true;


# --- ROUNDED CORNERS ---
# Set the global radius to match your Rofi menu
corner-radius = 8;

# Do not round the status bar, desktop background, or fullscreen windows
rounded-corners-exclude = [
    "window_type = 'desktop'",
    "_NET_WM_STATE@:a *= '_NET_WM_STATE_FULLSCREEN'"
];

# --- BLUR ---
blur-method = "dual_kawase";
blur-strength = 6;
blur-background = true;

# Don't blur the screen behind the desktop or status bar
blur-background-exclude = [
    "window_type = 'desktop'",
    "class_g = 'xmobar'",
    "window_type = 'dock'",
    "_GTK_FRAME_EXTENTS@:c",       # CRITICAL: Fixes weird boxes around GTK shadows
    "class_g = 'slop'"             # Prevents blur loops when using screenshot tools
];

# --- OPACITY RULES ---
opacity-rule = [
    # --- File Managers & Dialogs ---
    "80:class_g = 'Thunar' && focused",
    "70:class_g = 'Thunar' && !focused",
    "75:window_type = 'dialog'",        # <--- This catches Browser Uploads & Flameshot Saves!

    # --- System Tools ---
    "90:class_g = 'Blueman-manager' && focused",   # Bluetooth
    "75:class_g = 'Blueman-manager' && !focused",
    "75:class_g = 'Pavucontrol'",       # Volume Controller (assuming you use pavucontrol)
    "75:class_g = 'nm-connection-editor'", # Network Manager GUI

    # --- Applications ---
    "85:class_g = 'Spotify'",                   # Spotify
    "85:class_g = 'code-oss'",                  # VS Code
    "75:class_g = 'Deadbeef'",                  # DeaDBeeF
    "85:class_g = 'vesktop'",                   # Vesktop
    "85:class_g = 'firefox' && !focused",       # Firefox
    "85:class_g = 'apostrophe'",                # Apostrophe
    "85:class_g = 'Brave-browser' && !focused", # Brave

    # --- Opaque Exceptions ---
    "100:class_g = 'vlc'"               # Keep video player solid
];

# --- FADING (REQUIRED FOR ANIMATIONS) ---
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;

#################################
#           Animations          #
#################################

animations = true;
# The physics of the animation (spring-like feel)
animation-stiffness = 250;
animation-window-mass = 0.6;
animation-dampening = 20;
animation-clamping = true;

# How different actions behave
# zoom: slight scale up/down
# slide-up/slide-down: directional movement
# fly-in: moves from the center of the screen

# Opening a new window (M-Enter)
animation-for-open-window = "slide-down"; 

# Closing a window (M-S-c)
animation-for-unmap-window = "zoom"; 

# Shifting windows or resizing the master area (M-h/l or M-S-j/k)
animation-for-transient-window = "slide-down";

# Global animation parameters
animation-stiffness = 300.0;
animation-dampening = 20.0;
animation-clamping = true;
animation-mass = 1.0;
